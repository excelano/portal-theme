name: ci

on:
  workflow_dispatch:

jobs:
  ci:
    uses: excelano/.github/.github/workflows/rust-lib-ci.yml@main

  # The empty arms, compiled where they are empty: `follow` is a no-op off
  # Linux, and this is what shows the crate costs a consumer nothing there.
  platforms:
    name: Platforms
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
